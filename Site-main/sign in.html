<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sign in</title>
<link rel="stylesheet" type="text/css" href="/vxodforma.css">
<link rel="stylesheet" type="text/css" href="/animate.css/animate.css">
</head>
<body class="animate__animated animate__zoomIn">
  <div class="form-container">
    <h2>Sign in</h2>
    <form>
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Email address..." />

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="*******" />
      <button type="submit" class="button">Sign in</button>
      <div class="sign-up">
        No account? <a id="createAcc" href="/formreg.html"><span style="text-decoration: none;">Create an account  →</span></a>
      </div>
    </form>
  </div>
</body>
</html>
